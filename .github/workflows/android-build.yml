name: Android Build

# Builds and tests the native Kotlin Android app. Runs on every PR and on pushes to main.
#
# Two flavors: "full" (default, keeps Chromecast support) and "fdroid" (excludes Google's
# proprietary Cast/Play-Services libraries entirely, for the official F-Droid submission) -- see
# the flavor comment in app/build.gradle.kts. Lint/test/assemble run for both so a regression in
# either flavor's flavor-specific sources (app/src/{full,fdroid}/) fails CI.
#
# The signed release AAB step below only runs when RELEASE_KEYSTORE_BASE64 is configured as a
# repo secret (see app/keystore.properties.example for the expected values); it builds the "full"
# flavor (matching what actually ships to Play Store) and produces a downloadable artifact,
# mainly useful for testing a Play Console upload by hand outside the normal release flow. The
# actual automated Play Store publish (internal track only; promoting to production stays
# manual) happens in play-publish.yml, invoked from release-please.yml.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Lint, test, assemble
    runs-on: ubuntu-latest
    env:
      HAS_RELEASE_SIGNING: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4

      - name: Lint
        run: ./gradlew :app:lintFullDebug :app:lintFdroidDebug --no-daemon

      - name: Unit tests
        run: ./gradlew :app:testFullDebugUnitTest :app:testFdroidDebugUnitTest --no-daemon

      - name: Assemble debug APKs
        run: ./gradlew :app:assembleFullDebug :app:assembleFdroidDebug --no-daemon

      - name: Upload full-flavor debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-full-debug
          path: app/build/outputs/apk/full/debug/app-full-debug.apk
          if-no-files-found: error

      - name: Upload fdroid-flavor debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-fdroid-debug
          path: app/build/outputs/apk/fdroid/debug/app-fdroid-debug.apk
          if-no-files-found: error

      - name: Set up release signing
        if: ${{ github.event_name != 'pull_request' && env.HAS_RELEASE_SIGNING == 'true' }}
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          cat > app/keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=$RELEASE_KEYSTORE_PASSWORD
          keyAlias=$RELEASE_KEY_ALIAS
          keyPassword=$RELEASE_KEY_PASSWORD
          EOF

      - name: Bundle signed release AAB
        if: ${{ github.event_name != 'pull_request' && env.HAS_RELEASE_SIGNING == 'true' }}
        run: ./gradlew :app:bundleFullRelease --no-daemon

      - name: Upload release AAB
        if: ${{ github.event_name != 'pull_request' && env.HAS_RELEASE_SIGNING == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-release
          path: app/build/outputs/bundle/fullRelease/app-full-release.aab
          if-no-files-found: error

name: Android Build

# Builds and tests the native Kotlin Android app. Runs on every PR and on pushes to main.
#
# Two flavors: "full" (default, keeps Chromecast support) and "fdroid" (excludes Google's
# proprietary Cast/Play-Services libraries entirely, for the official F-Droid submission) -- see
# the flavor comment in app/build.gradle.kts. Lint/test/assemble run for both so a regression in
# either flavor's flavor-specific sources (app/src/{full,fdroid}/) fails CI.
#
# No persistent signing secrets or release environments are available to this workflow.
# CI artifacts use an ephemeral runner key and are NOT upgrade-compatible release APKs.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Lint, test, assemble
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          # Google removed the legacy standalone "tools" package (this action's default) from the
          # SDK repository; sdkmanager now fails to find it. platform-tools is all this job needs -
          # the Android Gradle Plugin fetches whatever platform/build-tools versions it requires on
          # its own, once licenses are accepted.
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4

      - name: Install pinned Android build tools
        run: sdkmanager 'platforms;android-36' 'platforms;android-37.2' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.30.5'

      - name: Pre-create the debug keystore
        # AGP lazily auto-generates ~/.android/debug.keystore on first use. With
        # org.gradle.parallel=true, assembling both flavors' debug builds can trigger that
        # generation from two packaging tasks at once on a fresh runner (no keystore yet),
        # corrupting it and failing packageFullDebug/packageFdroidDebug non-deterministically.
        # Creating it up front, before any Gradle task runs, removes the race.
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v -keystore ~/.android/debug.keystore \
            -storepass android -alias AndroidDebugKey -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 10950 \
            -keyalg RSA -keysize 2048

      - name: Lint
        run: ./gradlew :app:lintFullDebug :app:lintFdroidDebug --no-daemon

      - name: Unit tests
        run: ./gradlew :app:testFullDebugUnitTest :app:testFdroidDebugUnitTest --no-daemon

      - name: Download migration and generation-guard SQL
        run: python3 tools/android/test_storage_sql.py

      - name: Reader appearance and EPUB SMIL engine checks
        run: node --test tools/android/test_reader_appearance.mjs tools/android/test_read_along.mjs tools/android/test_epub_streaming.mjs

      - name: Russian localization coverage and format arguments
        run: python3 tools/android/test_localization.py

      - name: Instrumentation result parsing
        run: python3 tools/android/test_instrumentation_runner.py

      - name: Release provenance and signing isolation policy
        run: python3 tools/android/test_release_policy.py

      - name: Assemble debug APKs
        run: ./gradlew :app:assembleFullDebug :app:assembleFdroidDebug --no-daemon

      - name: Upload full-flavor debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-full-debug
          path: app/build/outputs/apk/full/debug/app-full-debug.apk
          if-no-files-found: error

      - name: Upload fdroid-flavor debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-fdroid-debug
          path: app/build/outputs/apk/fdroid/debug/app-fdroid-debug.apk
          if-no-files-found: error

name: Release Please

# Fully automates versioning. Merging a normal PR to main may add conventional commits
# (feat:/fix:/etc.); release-please keeps an always-up-to-date "release PR" open with the
# resulting version bump and changelog. Merging that PR is the only manual step left -- it
# creates the tag and GitHub Release, which this same workflow run then uses to trigger the
# signed APK build and (if configured) the Play Store internal-track upload.
#
# release-please's own generic-file updater (the `x-release-please-version` comment marker) is
# unreliable in practice -- see https://github.com/googleapis/release-please-action/issues/1130
# -- so app/build.gradle.kts isn't in its extra-files config at all. Instead, a companion step
# below reads the version release-please just computed straight out of
# .release-please-manifest.json (which it does update reliably) and writes both versionName and
# the derived versionCode directly into app/build.gradle.kts, pinning them onto the same release
# PR before anyone merges it.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        id: release
        with:
          release-type: simple

      - name: Checkout pending release PR branch
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ fromJson(steps.release.outputs.pr).headBranchName }}

      - name: Pin versionName/versionCode on the release PR
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        run: |
          set -euo pipefail
          versionName=$(jq -r '.["."]' .release-please-manifest.json)
          IFS='.' read -r major minor patch <<< "$versionName"
          versionCode=$((major * 10000 + minor * 100 + patch))
          sed -i "s/versionName = \"[0-9.]*\"/versionName = \"${versionName}\"/" app/build.gradle.kts
          sed -i "s/versionCode = [0-9]\+/versionCode = ${versionCode}/" app/build.gradle.kts
          if git diff --quiet -- app/build.gradle.kts; then
            echo "already at versionName ${versionName} / versionCode ${versionCode}, nothing to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -am "chore: pin versionName ${versionName} / versionCode ${versionCode}"
            git push
          fi

  build-release:
    name: Build & attach signed APK
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    uses: ./.github/workflows/android-release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit

  publish-play:
    name: Publish to Play Store
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    uses: ./.github/workflows/play-publish.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit

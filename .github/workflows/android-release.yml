name: Android Release APK

# Builds a signed release APK and attaches it to a GitHub Release so the self-hosted F-Droid
# repo (deranjer/fdroid) can pick it up. versionCode/versionName are plain literals in
# app/build.gradle.kts (bumped automatically by release-please), so no CI-side override is
# needed here.
#
# Normally invoked by release-please.yml right after it creates a release; `workflow_dispatch`
# is kept as a manual fallback to (re)build and attach an APK to an existing tag.

on:
  workflow_call:
    inputs:
      tag:
        description: Existing tag to build and attach an APK to
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build and attach an APK to
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build & attach signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.tag }}

      - name: Resolve tag
        id: tag
        run: echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4

      - name: Set up release signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          cat > app/keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=$RELEASE_KEYSTORE_PASSWORD
          keyAlias=$RELEASE_KEY_ALIAS
          keyPassword=$RELEASE_KEY_PASSWORD
          EOF

      - name: Assemble signed release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Attach APK to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          VERSION="${TAG#v}"
          cp app/build/outputs/apk/release/app-release.apk "bookorbit-$VERSION.apk"
          gh release create "$TAG" "bookorbit-$VERSION.apk" --title "$TAG" --generate-notes ||
            gh release upload "$TAG" "bookorbit-$VERSION.apk" --clobber

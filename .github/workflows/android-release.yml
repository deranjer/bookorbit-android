name: Android Release APK

# Builds a signed release APK and attaches it to a GitHub Release so the self-hosted F-Droid
# repo (deranjer/fdroid) can pick it up. versionCode/versionName are plain literals in
# app/build.gradle.kts (bumped automatically by release-please), so no CI-side override is
# needed here.
#
# Builds and attaches both flavors: "full" (keeps Chromecast support, the primary asset) and
# "fdroid" (excludes Google's Cast/Play-Services libraries entirely). The official F-Droid
# submission builds the "fdroid" flavor itself from its own recipe -- this asset exists so that
# recipe can reference a matching Binaries/AllowedAPKSigningKeys for reproducible-build
# verification, since it's a genuinely different binary than the "full" one.
#
# Also attaches the signed "full" AAB for uploading to Play Console by hand (automatic Play
# publishing is paused - see release-please.yml).
#
# Only invoked explicitly as a release, on main, for an existing release tag whose
# exact commit is a merged PR result. Keys belong to stable-release environment,
# never repository-wide secrets. Normal CI cannot run this signing job.

on:
  workflow_call:
    inputs:
      tag:
        description: Existing tag to build and attach an APK to
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build and attach an APK to
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    name: Build & attach signed APK
    runs-on: ubuntu-latest
    environment: stable-release
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Resolve tag
        id: tag
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          SHA=$(git rev-parse "refs/tags/$TAG^{commit}")
          python3 tools/android/verify-release-source.py "$GITHUB_REPOSITORY" "$SHA"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          git checkout --detach "$SHA"

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          # Google removed the legacy standalone "tools" package (this action's default) from the
          # SDK repository; sdkmanager now fails to find it. platform-tools is all this job needs -
          # the Android Gradle Plugin fetches whatever platform/build-tools versions it requires on
          # its own, once licenses are accepted.
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4

      - name: Set up release signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          cat > app/keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=$RELEASE_KEYSTORE_PASSWORD
          keyAlias=$RELEASE_KEY_ALIAS
          keyPassword=$RELEASE_KEY_PASSWORD
          EOF

      - name: Assemble signed release APKs and Play bundle
        run: ./gradlew :app:assembleFullRelease :app:assembleFdroidRelease :app:bundleFullRelease --no-daemon --stacktrace

      - name: Attach APKs to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          TAG="$RELEASE_TAG"
          VERSION="${TAG#v}"
          cp app/build/outputs/apk/full/release/app-full-release.apk "bookorbit-$VERSION.apk"
          cp app/build/outputs/apk/fdroid/release/app-fdroid-release.apk "bookorbit-fdroid-$VERSION.apk"
          cp app/build/outputs/bundle/fullRelease/app-full-release.aab "bookorbit-$VERSION.aab"
          ASSETS=("bookorbit-$VERSION.apk" "bookorbit-fdroid-$VERSION.apk" "bookorbit-$VERSION.aab")
          gh release upload "$TAG" "${ASSETS[@]}" --repo "$GITHUB_REPOSITORY"
